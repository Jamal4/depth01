name: depth01

# One collection per DSE day (Sun-Thu). GitHub can start a scheduled run hours late (2026-11-10: the 09:41 run started
# at 17:47 Dhaka), so there are backup starts every 30 min from 09:11 to 11:41 Dhaka (03:11-05:41 UTC, odd minutes).
# The concurrency group below runs them one at a time: a backup waits while a run collects, then starts after the
# close and exits; a backup that starts in the session after a failed run collects the rest of the day (the import
# merges several artifacts of one day). The collector exits by itself on holidays and outside the session, and waits
# for the open when it starts early.
on:
  schedule:
    - cron: "11,41 3 * * 0-4"
    - cron: "11,41 4 * * 0-4"
    - cron: "11,41 5 * * 0-4"
  workflow_dispatch:
    inputs:
      codes:
        description: "Test: comma list (e.g. SPCL,GP) - one pass, no session gate. Empty = the normal run."
        required: false
        default: ""
      universe_only:
        description: "Only build and print the universe (no depth requests, no artifact)."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: depth01
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355            # GitHub's limit is 360
    steps:
      - uses: actions/checkout@v4

      - name: Universe check
        if: ${{ inputs.universe_only == true }}
        run: python3 collector.py universe

      - name: Collect
        if: ${{ inputs.universe_only != true }}
        timeout-minutes: 340            # below the job's 355: finalize + upload still run after a hang; a 09:11 start
                                        # is cut at 14:51 Dhaka at the earliest, after a 14:30 close
        env:
          CODES: ${{ inputs.codes }}
        run: python3 collector.py run --out out --codes "${CODES:-}"

      - name: Finalize (also after a failure)
        id: fin
        if: ${{ always() && inputs.universe_only != true }}
        run: python3 collector.py finalize --out out

      - name: Upload the day
        if: ${{ always() && steps.fin.outputs.name != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.fin.outputs.name }}
          path: out/${{ steps.fin.outputs.name }}/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
